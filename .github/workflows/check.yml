name: check

on:
  push:
    branches: [master, nix-migration]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # 計画: CI上は通常Nix (v17+ の既定は Determinate Nix のため明示)
          determinate: false
      - name: nix flake check
        run: nix flake check
      - name: build homeConfigurations.wsl
        run: nix build -L .#homeConfigurations.wsl.activationPackage
      - name: build homeConfigurations.linux
        run: nix build -L .#homeConfigurations.linux.activationPackage

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - name: build darwinConfigurations.helium
        run: nix build -L .#darwinConfigurations.helium.system
      - name: build darwinConfigurations.70-42660
        run: nix build -L .#darwinConfigurations."70-42660".system
