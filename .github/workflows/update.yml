name: update-flake-lock

on:
  schedule:
    # 毎日 06:00 UTC (JST 15:00)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# 同じ更新 branch への同時 push を避けるため、重複実行は直列化する
concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - name: nix flake update
        run: nix flake update
      # sign-commits: GitHub API 経由でコミットを作成させ、github-actions[bot] の
      # verified 署名を付与する (ruleset "all" の required_signatures は Git push による
      # 未署名コミットを拒否するため、DeterminateSystems/update-flake-lock は使えない)。
      # 署名は GITHUB_TOKEN / GitHub App token でのみ有効で PAT では付かない。
      - name: create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          sign-commits: true
          # 固定 branch: 既存の open PR を更新し、PR が量産されるのを防ぐ
          branch: update_flake_lock_action
          add-paths: flake.lock
          commit-message: "flake.lock: Update"
          pr-title: "chore(flake): update flake.lock"
          pr-body: |
            Automated daily flake.lock update.
