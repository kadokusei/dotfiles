{{- /* chezmoi:modify-template */ -}}
{{- /* Edit shared values here; all other keys remain local. TOML formatting is regenerated. */ -}}
{{- .chezmoi.stdin | fromToml
    | setValueAtPath "model" "gpt-6-astra"
    | setValueAtPath "model_reasoning_effort" "medium"
    | setValueAtPath "default_subagent_model" "gpt-5.6-luna"
    | setValueAtPath "default_subagent_reasoning_effort" "max"
    | setValueAtPath "service_tier" "default"
    | setValueAtPath "approvals_reviewer" "auto_review"
    | setValueAtPath "approval_policy" "on-request"
    | setValueAtPath "sandbox_mode" "workspace-write"
    | setValueAtPath "features.context_management.experimental_mode" true
    | setValueAtPath "marketplaces.ponytail.source_type" "git"
    | setValueAtPath "marketplaces.ponytail.source" "https://github.com/DietrichGebert/ponytail.git"
    | setValueAtPath (list "plugins" "ponytail@ponytail" "enabled") true
    | toToml -}}
